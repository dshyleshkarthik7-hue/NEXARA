name: NEXARA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run test suite
        run: npm test
      - name: Build browser workspace and assemble ZIP
        run: npm run package
      - name: Upload NEXARA package
        uses: actions/upload-artifact@v4
        with:
          name: NEXARA-package
          path: dist/NEXARA-package.zip
          if-no-files-found: error
          retention-days: 30
