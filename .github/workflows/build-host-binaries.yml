name: Build NEXARA host binaries and guest kernel
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-host-binaries.sh"
      - "scripts/build-firecracker-kernel.sh"
      - "scripts/build-firecracker-guest-initramfs.sh"
      - "scripts/build-firecracker-test-disk.sh"
      - "scripts/verify-host-bundle.sh"
      - ".github/workflows/build-host-binaries.yml"
      - "docs/FIRECRACKER-GUEST-IMAGE.md"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev \
            musl-tools musl-dev libseccomp-dev cpio gzip git curl wget perl file python3 \
            bc bison flex xz-utils libelf-dev libncurses-dev e2fsprogs
      - name: Build Firecracker, jailer and static BusyBox
        env:
          FIRECRACKER_TAG: v1.13.1
          BUSYBOX_TAG: 1_36_1
        run: bash scripts/build-host-binaries.sh
      - name: Build pinned Linux kernel
        env:
          LINUX_KERNEL_VERSION: 6.12.1
        run: bash scripts/build-firecracker-kernel.sh
      - name: Build persistent ext4 guest test disk
        run: bash scripts/build-firecracker-test-disk.sh "$GITHUB_WORKSPACE/dist/host-binaries/nexara-test-rootfs.ext4"
      - name: Build minimal guest initramfs
        run: |
          bash scripts/build-firecracker-guest-initramfs.sh \
            "$GITHUB_WORKSPACE/dist/host-binaries/busybox" \
            "$GITHUB_WORKSPACE/dist/host-binaries/nexara-guest-initramfs.cpio.gz"
          cd dist/host-binaries
          sha256sum nexara-guest-initramfs.cpio.gz >> SHA256SUMS
          cat KERNEL-SHA256SUMS >> SHA256SUMS
          sha256sum nexara-test-rootfs.ext4 >> SHA256SUMS
      - name: Verify complete runtime bundle
        run: bash scripts/verify-host-bundle.sh
      - name: Upload complete host and guest bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexara-microvm-bundle-linux-x86_64
          path: dist/host-binaries/
          if-no-files-found: error
          retention-days: 30
